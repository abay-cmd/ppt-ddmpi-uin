<style>

<script>
const D=JSON.parse(document.getElementById('data').textContent),M=D.meta,deck=document.getElementById('deck');
const ARW='<svg><use href="#ar"/></svg>',LG='<img class="logo" src="logo.png" alt="Logo UIN Sunan Gunung Djati Bandung">';
const xs=()=>'<div class="xs el">'+'&times;'.repeat(12).split(';').filter(Boolean).map(()=>'<span class="x">&times;</span>').join('')+'</div>';
const ttl=(t,k)=>'<h2 class="ttl">'+t.map((l,j)=>`<span class="ln ${l[1]}" style="--in:${l[2]};--k:${j}">${l[0]}</span>`).join('')+ARW+'</h2>';
const ft=()=>'<div class="ft">'+LG+'<span class="hn">Klik poin untuk melihat penjelasan</span></div>';
function build(d,i,n){
 const s=document.createElement('section');s.className='sl';
 if(i==0){s.innerHTML=`<div class="main cv"><div><span class="pill rv">MAKALAH 2026</span><h1 class="ttl">${M.judul.map((w,j)=>`<span class="ln ${j==1?'r':''}" style="--in:${[0,6,0,6][j]};--k:${j}">${w}</span>`).join('')}</h1><p class="meta rv" style="--i:5">${M.mk}<br><b>Dosen</b> ${M.dosen}<br><b>Penulis</b> ${M.penulis.join(' &middot; ')}</p></div><div class="disc rv" style="--i:4"><img src="logo.png" alt="Logo UIN Sunan Gunung Djati Bandung"></div></div><p class="sr rv" style="--i:6">${M.inst}</p>`;return s}
 if(i==n-1){s.innerHTML=`<div class="main cv"><div><h2 class="ttl"><span class="ln r" style="--in:0;--k:0">TERIMA</span><span class="ln" style="--in:8;--k:1">KASIH</span></h2><p class="meta rv" style="--i:3">Tanya jawab dan diskusi<br>${M.penulis.join(' &middot; ')}</p><div class="dlr"><a class="btn rv" style="--i:4" href="Budaya-dan-Iklim-Organisasi-Pendidikan.pdf" download>Unduh PDF</a><a class="btn rv" style="--i:5" href="Budaya-dan-Iklim-Organisasi-Pendidikan.pptx" download>Unduh PPTX</a></div></div><div class="disc rv" style="--i:4"><img src="logo.png" alt="Logo UIN Sunan Gunung Djati Bandung"></div></div><p class="sr rv" style="--i:6">Acuan utama: Hoy & Miskel (2008), Educational administration: Theory, research, and practice (8th ed.). McGraw-Hill.</p>`;return s}
 const rows=d.l=='rows',it=d.i.map((x,j)=>rows?`<div class="it row rv" tabindex="0" role="button" data-j="${j}" style="--i:${j+2}"><span class="ic ${j%2?'rd':''}">0${j+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p>${x[2]?`<small>${x[2]}</small>`:''}</div></div>`:`<div class="it rv" tabindex="0" role="button" data-j="${j}" style="--i:${j+2}"><b class="no">0${j+1}</b><h3>${x[0]}</h3><p>${x[1]}</p>${x[2]?`<small>${x[2]}</small>`:''}</div>`).join('');
 s.className+=rows?' rows'+(d.f?' flip':''):' cols';
 s.innerHTML=`<div class="main">${ttl(d.t)}${xs()}${rows?`<div class="list">${it}</div>`:`<div class="grid" style="--n:${d.n}">${it}</div>`}</div>${d.s?`<p class="sr rv" style="--i:7">${d.s}</p>`:''}${ft()}`;return s}
const L=[{},...D.slides,{}];
L.forEach((d,i)=>deck.append(build(d,i,L.length)));
const S=[...deck.children];let k=0;
function split(el,lt){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{if(!n.textContent.trim())return;const f=document.createDocumentFragment();
 n.textContent.split(/(\s+)/).forEach(p=>{if(!p.trim()){f.append(' ');return}const e=document.createElement('span');
 if(lt&&n.parentElement.closest('.ttl')){e.className='wd';[...p].forEach(c=>{const q=document.createElement('span');q.className='w m'+(k++%6);q.textContent=c;e.append(q)})}
 else{e.className='wd w m'+(k++%6);e.textContent=p}f.append(e)});n.replaceWith(f)})}
S.forEach(s=>{s.querySelectorAll('.ttl .ln,.it h3,.it p,.it small,.no,.ic,.pill,.meta,.sr,.btn,.x,.hn').forEach(e=>{if(!e.querySelector('.w')&&!e.closest('.x')||e.classList.contains('x'))split(e,1)});
 s.querySelectorAll('.x').forEach(e=>e.classList.add('el'))});
const T=[[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],[{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0)'}],[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}],[{transform:'translateX(100%)'},{transform:'none'}],[{transform:'scale(1.6)',opacity:0},{transform:'none',opacity:1}],[{clipPath:'inset(0 50% 0 50%)'},{clipPath:'inset(0)'}],[{transform:'translateY(-100%) rotate(-6deg)'},{transform:'none'}],[{transform:'rotate(90deg) scale(.1)',opacity:0},{transform:'none',opacity:1}],[{clipPath:'polygon(0 0,0 0,0 0)'},{clipPath:'polygon(0 0,250% 0,0 250%)'}],[{clipPath:'inset(50% 0 50% 0)'},{clipPath:'inset(0)'}]];
function fit(s){s.classList.add('nf');let k=1;s.style.setProperty('--s',1);const m=s.querySelector('.main'),bad=()=>m.scrollHeight>m.clientHeight+1||s.scrollHeight>s.clientHeight+1||s.scrollWidth>s.clientWidth+1||[...s.querySelectorAll('.ln,.it h3,.it p')].some(l=>l.scrollWidth>l.clientWidth+1);
 while(bad()&&k>.4){k-=.03;s.style.setProperty('--s',k.toFixed(2))}s.classList.remove('nf')}
let c=0,lock=0;const cn=document.getElementById('cn'),bar=document.getElementById('bar'),p2=n=>String(n).padStart(2,'0');
function go(n,first){if(lock||n<0||n>=S.length||(n==c&&!first))return;const o=S[c],e=S[n];
 e.classList.add('cur','on');fit(e);cn.textContent=p2(n+1)+' / '+S.length;bar.style.width=(n+1)/S.length*100+'%';history.replaceState(null,'','#'+(n+1));
 if(first){c=n;return}lock=1;e.classList.add('in');const t=T[(n*7+3)%T.length];
 e.animate(t,{duration:950,easing:'cubic-bezier(.7,0,.2,1)'}).onfinish=()=>{o.classList.remove('cur','on');e.classList.remove('in');lock=0};c=n}
const md=document.getElementById('md');let MO=0;
function op(it){const si=S.indexOf(it.closest('.sl')),j=+it.dataset.j,d=L[si],x=d.i[j],e=d.e&&d.e[j];if(!e)return;
 md.querySelector('.mn').textContent='0'+(j+1);md.querySelector('.mt').textContent=x[0];md.querySelector('.mb').textContent=e[0];md.querySelector('.ms').textContent='Sumber: '+e[1];
 md.querySelectorAll('.mt,.mb,.ms').forEach(el=>split(el,1));md.classList.add('o');MO=1;md.querySelector('.mx').focus()}
function cl(){md.classList.remove('o');MO=0}
md.addEventListener('click',e=>{if(e.target==md||e.target.closest('.mx'))cl()});
deck.addEventListener('click',e=>{const it=e.target.closest('.it');if(it)op(it)});
const nx=()=>go(c+1),pv=()=>go(c-1);
document.getElementById('nx').onclick=nx;document.getElementById('pv').onclick=pv;
addEventListener('keydown',e=>{if(MO){if(e.key=='Escape')cl();return}if(e.key=='Enter'&&document.activeElement.classList.contains('it')){op(document.activeElement);return}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();nx()}else if(['ArrowLeft','PageUp'].includes(e.key))pv();else if(e.key=='Home')go(0);else if(e.key=='End')go(S.length-1);else if(e.key=='f'||e.key=='F')fs()});
let tx=0,ty=0;deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
deck.addEventListener('touchend',e=>{if(MO)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)dx<0?nx():pv()},{passive:true});
let wt=0;addEventListener('wheel',e=>{if(MO)return;if(innerWidth<innerHeight||Date.now()-wt<1100)return;if(Math.abs(e.deltaY)>30){wt=Date.now();e.deltaY>0?nx():pv()}},{passive:true});
const dm=document.getElementById('dm');document.getElementById('db').onclick=e=>{e.stopPropagation();dm.classList.toggle('o')};addEventListener('click',()=>dm.classList.remove('o'));
const fb=document.getElementById('fs');function fs(){const d=document,r=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else(r.requestFullscreen||r.webkitRequestFullscreen||(()=>{})).call(r)}
fb.onclick=fs;if(!document.documentElement.requestFullscreen&&!document.documentElement.webkitRequestFullscreen)fb.style.display='none';
addEventListener('resize',()=>fit(S[c]));document.fonts&&document.fonts.ready.then(()=>fit(S[c]));
go(Math.min(S.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1)),1);
</script></body></html>
